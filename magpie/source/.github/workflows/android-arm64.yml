name: Android ARM64 build
on:
  workflow_dispatch:
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/android-arm64.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Android ARM64 CLI
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/magpie-android-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: magpie-android-arm64
          path: dist/magpie-android-arm64
