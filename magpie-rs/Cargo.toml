[package]
name = "magpie-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
codearts-gateway = { path = "../urban-octo-waddle" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
config = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic = "0.13"
prost = "0.13"
tonic-prost = "0.14"
thiserror = "2"
anyhow = "1"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
bytes = "1"
futures-util = "0.3"
